<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5260"/>
    </marker>
  </defs>
  <style>
    .box{fill:#fff;stroke:#14181f;stroke-width:1.3}
    .hl{fill:#f4faf8;stroke:#0f5f52;stroke-width:1.6}
    .zone{fill:#f7f9fb;stroke:#8a919c;stroke-width:1;stroke-dasharray:4 3}
    .inner{fill:#eef2f6;stroke:#8a919c;stroke-width:1;stroke-dasharray:2 2}
    .t{font-size:11.5px;fill:#14181f;font-weight:600}
    .s{font-size:9.5px;fill:#4a5260}
    .m{font-size:9px;fill:#4a5260;font-family:Menlo,monospace}
    .zl{font-size:9.5px;fill:#767e8c;letter-spacing:.09em}
    .ln{stroke:#4a5260;stroke-width:1.2;fill:none;marker-end:url(#t)}
    .bi{stroke:#4a5260;stroke-width:1.2;fill:none;marker-end:url(#t);marker-start:url(#t)}
  </style>

  <!-- host -->
  <text x="14" y="22" class="zl">YOUR MACHINE</text>
  <rect x="20" y="30" width="150" height="34" rx="4" class="box"/>
  <text x="95" y="51" class="s" text-anchor="middle">browser, curl</text>
  <rect x="520" y="30" width="226" height="34" rx="4" class="box"/>
  <text x="633" y="46" class="t" text-anchor="middle">deploy/fix, smoke.sh</text>
  <text x="633" y="59" class="s" text-anchor="middle">FIX clients on the host</text>

  <!-- edge -->
  <rect x="14" y="84" width="732" height="80" rx="6" class="zone"/>
  <text x="190" y="100" class="zl">most-edge — published ports only</text>
  <rect x="40" y="110" width="110" height="42" rx="4" class="box"/>
  <text x="95" y="129" class="t" text-anchor="middle">web</text>
  <text x="95" y="144" class="m" text-anchor="middle">:8081</text>
  <rect x="170" y="110" width="130" height="42" rx="4" class="box"/>
  <text x="235" y="129" class="t" text-anchor="middle">control</text>
  <text x="235" y="144" class="m" text-anchor="middle">:8080</text>

  <!-- aeron -->
  <rect x="14" y="180" width="732" height="196" rx="6" class="zone"/>
  <text x="26" y="196" class="zl">most-aeron — internal, the exchange's inside</text>
  <rect x="30" y="204" width="450" height="160" rx="5" class="inner"/>
  <text x="40" y="219" class="zl">THE SHARD — one media driver, shared /dev/shm</text>
  <rect x="46" y="228" width="200" height="50" rx="4" class="box"/>
  <text x="146" y="248" class="t" text-anchor="middle">cluster-host, alias shard0</text>
  <text x="146" y="264" class="s" text-anchor="middle">driver · archive · consensus</text>
  <rect x="46" y="300" width="96" height="44" rx="4" class="box"/>
  <text x="94" y="326" class="t" text-anchor="middle">engine</text>
  <rect x="152" y="300" width="96" height="44" rx="4" class="box"/>
  <text x="200" y="326" class="t" text-anchor="middle">gateway</text>
  <rect x="258" y="300" width="104" height="44" rx="4" class="box"/>
  <text x="310" y="326" class="t" text-anchor="middle">market-data</text>
  <rect x="372" y="300" width="96" height="44" rx="4" class="box"/>
  <text x="420" y="326" class="t" text-anchor="middle">discovery</text>
  <rect x="270" y="236" width="196" height="40" rx="4" class="box"/>
  <text x="368" y="252" class="s" text-anchor="middle">every shard endpoint on shard0:</text>
  <text x="368" y="266" class="m" text-anchor="middle">20001 20002 40000–40004</text>
  <rect x="496" y="300" width="104" height="44" rx="4" class="box"/>
  <text x="548" y="320" class="t" text-anchor="middle">control-driver</text>
  <text x="548" y="334" class="s" text-anchor="middle">control's own</text>

  <!-- the adapter, on both -->
  <rect x="616" y="104" width="124" height="254" rx="5" class="hl"/>
  <text x="678" y="126" class="t" text-anchor="middle">fix-7</text>
  <text x="678" y="141" class="s" text-anchor="middle">participant 7's adapter</text>
  <text x="678" y="164" class="m" text-anchor="middle">:9876 order entry</text>
  <text x="678" y="178" class="m" text-anchor="middle">:9877 market data</text>
  <text x="678" y="214" class="s" text-anchor="middle">two embedded</text>
  <text x="678" y="227" class="s" text-anchor="middle">media drivers</text>
  <text x="678" y="262" class="s" text-anchor="middle">volumes</text>
  <text x="678" y="276" class="m" text-anchor="middle">fix-7-data</text>
  <text x="678" y="290" class="m" text-anchor="middle">fix-7-md</text>
  <text x="678" y="330" class="s" text-anchor="middle">on both networks</text>

  <line x1="95" y1="64" x2="95" y2="108" class="ln"/>
  <line x1="660" y1="64" x2="660" y2="102" class="ln"/>
  <line x1="614" y1="244" x2="468" y2="252" class="bi"/>
  <text x="541" y="236" class="s" text-anchor="middle">UDP, dynamic MDC</text>
</svg>
