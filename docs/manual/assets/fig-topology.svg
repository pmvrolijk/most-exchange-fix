<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5260"/>
    </marker>
  </defs>
  <style>
    .box{fill:#fff;stroke:#14181f;stroke-width:1.3}
    .hl{fill:#f4faf8;stroke:#0f5f52;stroke-width:1.6}
    .store{fill:#f5f7fa;stroke:#14181f;stroke-width:1.1}
    .zone{fill:#f7f9fb;stroke:#8a919c;stroke-width:1;stroke-dasharray:4 3}
    .t{font-size:11.5px;fill:#14181f;font-weight:600}
    .s{font-size:9.5px;fill:#4a5260}
    .m{font-size:9px;fill:#4a5260;font-family:Menlo,monospace}
    .zl{font-size:9.5px;fill:#767e8c;letter-spacing:.09em}
    .ln{stroke:#4a5260;stroke-width:1.2;fill:none;marker-end:url(#t)}
    .bi{stroke:#4a5260;stroke-width:1.2;fill:none;marker-end:url(#t);marker-start:url(#t)}
  </style>

  <text x="14" y="24" class="zl">PARTICIPANTS</text>
  <rect x="14" y="40" width="120" height="50" rx="4" class="box"/>
  <text x="74" y="61" class="t" text-anchor="middle">participant 7</text>
  <text x="74" y="77" class="s" text-anchor="middle">its FIX engines</text>
  <rect x="14" y="200" width="120" height="50" rx="4" class="box"/>
  <text x="74" y="221" class="t" text-anchor="middle">participant 8</text>
  <text x="74" y="237" class="s" text-anchor="middle">its FIX engines</text>

  <rect x="160" y="48" width="84" height="34" rx="4" class="box"/>
  <text x="202" y="69" class="s" text-anchor="middle">TLS terminator</text>
  <rect x="160" y="208" width="84" height="34" rx="4" class="box"/>
  <text x="202" y="229" class="s" text-anchor="middle">TLS terminator</text>
  <line x1="134" y1="65" x2="158" y2="65" class="bi"/>
  <line x1="134" y1="225" x2="158" y2="225" class="bi"/>

  <!-- adapters -->
  <text x="270" y="24" class="zl">ADAPTER HOSTS — Linux, one per participant</text>
  <rect x="270" y="34" width="220" height="130" rx="5" class="hl"/>
  <text x="380" y="54" class="t" text-anchor="middle">adapter, participant 7</text>
  <text x="380" y="70" class="m" text-anchor="middle">fix.port · fix.md.port</text>
  <rect x="286" y="82" width="188" height="30" rx="3" class="store"/>
  <text x="380" y="101" class="s" text-anchor="middle">durable disk: archive, logs, store</text>
  <rect x="286" y="120" width="188" height="30" rx="3" class="store"/>
  <text x="380" y="139" class="s" text-anchor="middle">/dev/shm: two media drivers</text>

  <rect x="270" y="194" width="220" height="64" rx="5" class="hl"/>
  <text x="380" y="216" class="t" text-anchor="middle">adapter, participant 8</text>
  <text x="380" y="234" class="s" text-anchor="middle">the same, its own disk and ports</text>
  <line x1="244" y1="65" x2="268" y2="65" class="bi"/>
  <line x1="244" y1="225" x2="268" y2="225" class="bi"/>

  <!-- exchange -->
  <rect x="520" y="34" width="226" height="262" rx="6" class="zone"/>
  <text x="532" y="52" class="zl">TRADING NETWORK — most-exchange</text>
  <rect x="536" y="62" width="194" height="52" rx="4" class="box"/>
  <text x="633" y="82" class="t" text-anchor="middle">gateways</text>
  <text x="633" y="98" class="s" text-anchor="middle">orders in, reports out (UDP)</text>
  <rect x="536" y="128" width="194" height="52" rx="4" class="box"/>
  <text x="633" y="148" class="t" text-anchor="middle">discovery</text>
  <text x="633" y="164" class="s" text-anchor="middle">the directory (multicast)</text>
  <rect x="536" y="194" width="194" height="52" rx="4" class="box"/>
  <text x="633" y="214" class="t" text-anchor="middle">market data</text>
  <text x="633" y="230" class="s" text-anchor="middle">L1, L2, recovery (multicast)</text>
  <text x="633" y="280" class="s" text-anchor="middle">never the cluster directly</text>

  <line x1="492" y1="99" x2="518" y2="99" class="bi"/>
  <line x1="492" y1="226" x2="518" y2="226" class="bi"/>
  <text x="633" y="264" class="s" text-anchor="middle">every adapter reaches all three</text>
</svg>
