<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5260"/>
    </marker>
  </defs>
  <style>
    .box{fill:#fff;stroke:#14181f;stroke-width:1.3}
    .fin{fill:#f5f7fa;stroke:#14181f;stroke-width:2.2}
    .t{font-size:11.5px;fill:#14181f;font-weight:600}
    .s{font-size:9.5px;fill:#4a5260}
    .m{font-size:9px;fill:#4a5260;font-family:Menlo,monospace}
    .ln{stroke:#4a5260;stroke-width:1.2;fill:none;marker-end:url(#t)}
  </style>

  <!-- live states -->
  <rect x="20" y="40" width="140" height="48" rx="4" class="box"/>
  <text x="90" y="60" class="t" text-anchor="middle">Pending new</text>
  <text x="90" y="76" class="m" text-anchor="middle">39=A</text>
  <rect x="220" y="40" width="140" height="48" rx="4" class="box"/>
  <text x="290" y="60" class="t" text-anchor="middle">New</text>
  <text x="290" y="76" class="m" text-anchor="middle">39=0</text>
  <rect x="420" y="40" width="140" height="48" rx="4" class="box"/>
  <text x="490" y="60" class="t" text-anchor="middle">Partially filled</text>
  <text x="490" y="76" class="m" text-anchor="middle">39=1</text>
  <rect x="610" y="40" width="130" height="48" rx="4" class="fin"/>
  <text x="675" y="60" class="t" text-anchor="middle">Filled</text>
  <text x="675" y="76" class="m" text-anchor="middle">39=2</text>

  <!-- final states -->
  <rect x="20" y="170" width="140" height="48" rx="4" class="fin"/>
  <text x="90" y="190" class="t" text-anchor="middle">Rejected</text>
  <text x="90" y="206" class="m" text-anchor="middle">39=8</text>
  <rect x="290" y="170" width="140" height="48" rx="4" class="fin"/>
  <text x="360" y="190" class="t" text-anchor="middle">Cancelled</text>
  <text x="360" y="206" class="m" text-anchor="middle">39=4</text>
  <rect x="480" y="170" width="140" height="48" rx="4" class="fin"/>
  <text x="550" y="190" class="t" text-anchor="middle">Expired</text>
  <text x="550" y="206" class="m" text-anchor="middle">39=C</text>

  <!-- transitions -->
  <line x1="160" y1="64" x2="218" y2="64" class="ln"/>
  <text x="189" y="56" class="s" text-anchor="middle">150=0</text>
  <line x1="360" y1="64" x2="418" y2="64" class="ln"/>
  <text x="389" y="56" class="s" text-anchor="middle">150=F</text>
  <line x1="560" y1="64" x2="608" y2="64" class="ln"/>
  <text x="584" y="56" class="s" text-anchor="middle">150=F</text>
  <path d="M290,40 C290,24 675,24 675,38" class="ln"/>
  <text x="482" y="16" class="s" text-anchor="middle">150=F, filled at once</text>

  <line x1="90" y1="88" x2="90" y2="168" class="ln"/>
  <text x="96" y="132" class="s">150=8</text>
  <line x1="290" y1="88" x2="340" y2="168" class="ln"/>
  <line x1="490" y1="88" x2="380" y2="168" class="ln"/>
  <text x="372" y="132" class="s" text-anchor="middle">150=4</text>
  <line x1="310" y1="88" x2="530" y2="168" class="ln"/>
  <line x1="510" y1="88" x2="560" y2="168" class="ln"/>
  <text x="560" y="132" class="s">150=C</text>

  <text x="20" y="250" class="s">Heavy outline: final. Any state that is not final may be restated with OrdStatusUnknown (5001) = Y, its OrdStatus unchanged (4.7).</text>
</svg>
