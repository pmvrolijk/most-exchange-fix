<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 310" width="770" height="310" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5260"/>
    </marker>
  </defs>
  <style>
    .box{fill:#fff;stroke:#14181f;stroke-width:1.3}
    .store{fill:#f5f7fa;stroke:#14181f;stroke-width:1.1}
    .zone{fill:#f7f9fb;stroke:#8a919c;stroke-width:1;stroke-dasharray:4 3}
    .t{font-size:11.5px;fill:#14181f;font-weight:600}
    .s{font-size:9.5px;fill:#4a5260}
    .m{font-size:9px;fill:#4a5260;font-family:Menlo,monospace}
    .zl{font-size:9.5px;fill:#767e8c;letter-spacing:.09em}
    .ln{stroke:#4a5260;stroke-width:1.2;fill:none;marker-end:url(#t)}
    .bi{stroke:#4a5260;stroke-width:1.2;fill:none;marker-end:url(#t);marker-start:url(#t)}
  </style>

  <!-- FIX side -->
  <text x="20" y="28" class="zl">FIX 4.4 OVER TCP</text>
  <rect x="20" y="63" width="130" height="50" rx="4" class="box"/>
  <text x="85" y="84" class="t" text-anchor="middle">order entry</text>
  <text x="85" y="100" class="s" text-anchor="middle">the client's FIX engine</text>
  <rect x="20" y="173" width="130" height="50" rx="4" class="box"/>
  <text x="85" y="194" class="t" text-anchor="middle">market data</text>
  <text x="85" y="210" class="s" text-anchor="middle">the client's FIX engine</text>

  <!-- adapter -->
  <rect x="190" y="38" width="360" height="256" rx="6" class="zone"/>
  <text x="202" y="56" class="zl">ADAPTER PROCESS — one per participant</text>

  <rect x="230" y="66" width="280" height="44" rx="4" class="box"/>
  <text x="370" y="84" class="t" text-anchor="middle">order entry engine</text>
  <text x="370" y="100" class="m" text-anchor="middle">fix.port · library thread</text>
  <rect x="230" y="120" width="134" height="26" rx="3" class="store"/>
  <text x="297" y="137" class="s" text-anchor="middle">archive, fsynced</text>
  <rect x="376" y="120" width="134" height="26" rx="3" class="store"/>
  <text x="443" y="137" class="s" text-anchor="middle">order store (RocksDB)</text>
  <line x1="297" y1="110" x2="297" y2="118" class="ln"/>
  <line x1="443" y1="110" x2="443" y2="118" class="ln"/>

  <rect x="230" y="176" width="280" height="44" rx="4" class="box"/>
  <text x="370" y="194" class="t" text-anchor="middle">market data engine</text>
  <text x="370" y="210" class="m" text-anchor="middle">fix.md.port · library thread</text>
  <rect x="230" y="230" width="280" height="26" rx="3" class="store"/>
  <text x="370" y="247" class="s" text-anchor="middle">archive, unsynced, emptied at every start</text>
  <line x1="370" y1="220" x2="370" y2="228" class="ln"/>

  <text x="370" y="280" class="s" text-anchor="middle">each engine has its own embedded media driver</text>

  <line x1="150" y1="88" x2="228" y2="88" class="bi"/>
  <line x1="150" y1="198" x2="228" y2="198" class="bi"/>

  <!-- exchange -->
  <text x="600" y="28" class="zl">SBE OVER AERON UDP</text>
  <rect x="600" y="58" width="150" height="40" rx="4" class="box"/>
  <text x="675" y="76" class="t" text-anchor="middle">gateway</text>
  <text x="675" y="90" class="s" text-anchor="middle">orders in, reports out</text>
  <rect x="600" y="126" width="150" height="40" rx="4" class="box"/>
  <text x="675" y="144" class="t" text-anchor="middle">discovery</text>
  <text x="675" y="158" class="s" text-anchor="middle">the directory</text>
  <rect x="600" y="186" width="150" height="40" rx="4" class="box"/>
  <text x="675" y="204" class="t" text-anchor="middle">market data</text>
  <text x="675" y="218" class="s" text-anchor="middle">L1, L2, recovery feed</text>
  <text x="675" y="250" class="s" text-anchor="middle">most-exchange, one shard</text>

  <line x1="512" y1="80" x2="598" y2="78" class="bi"/>
  <line x1="598" y1="140" x2="512" y2="100" class="ln"/>
  <line x1="598" y1="152" x2="512" y2="186" class="ln"/>
  <line x1="598" y1="206" x2="512" y2="204" class="ln"/>
</svg>
