# GitHub Actions for most-exchange-fix: the build and the regular tests, on every push and pull
# request (Status §3 item 8).
#
# What it runs is `./gradlew build`: every module compiled with warnings as errors, and every
# module's tests, fix-session's AcceptorGuardTest in its own JVM included. Those tests run a real
# Artio engine, library and initiator against modelled gateways; nothing of most-exchange runs.
#
# What it leaves out, on purpose:
#   * e2e/run-e2e.sh and e2e/run-perf.sh: they need most-exchange's processes (its installs).
#   * :spikes:test: minutes of SIGKILLs and mark-file waits, run by hand after an Artio or Aeron bump
#     (spikes/build.gradle.kts).
#   * Any latency figure: a hosted runner is a shared VM (perf-claim).
#
# The SDK (most-exchange's `client` and `sbe`) comes from GitHub Packages, which wants a token even
# to read a public package (Rationale §3). settings.gradle.kts reads GITHUB_ACTOR and GITHUB_TOKEN.
# The job's own token is used unless the repository has an SDK_PACKAGES_TOKEN secret: a classic
# token with read:packages, for when the job token may not read most-exchange's package.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# One run per ref; a newer push supersedes an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    # Pinned, so a new image is a change made here rather than a surprise; ubuntu-latest moves to
    # 26.04 from 2026-10-19.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # v5, not v6: v6 moved caching into a proprietary component under Gradle's Terms of Use
      # (decided 2026-10-31). v5 runs on Node 24, as the other actions here do.
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and test
        run: ./gradlew build --continue
        env:
          GITHUB_TOKEN: ${{ secrets.SDK_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: |
            */build/test-results/test*/TEST-*.xml
            */build/reports/tests/
          retention-days: 7
