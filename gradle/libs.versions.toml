[versions]
kotlin = "2.4.10"
# Artio 0.182 is the release built on Aeron 1.53.0 -- the exchange's version. Artio and Aeron move
# together, and this pin moves with most-exchange's `aeron` (docs/Rationale.md §2).
artio = "0.182"
most-sdk = "0.1.0-SNAPSHOT"
junit = "6.1.3"

[libraries]
artio-core = { module = "uk.co.real-logic:artio-core", version.ref = "artio" }
artio-codecs = { module = "uk.co.real-logic:artio-codecs", version.ref = "artio" }
artio-session-codecs = { module = "uk.co.real-logic:artio-session-codecs", version.ref = "artio" }
most-client = { module = "nl.lamia.most.exchange:client", version.ref = "most-sdk" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
