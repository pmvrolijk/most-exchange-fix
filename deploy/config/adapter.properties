# Participant 7's adapter in most-exchange's dev stack (deploy/README.md).
#
# Every Aeron endpoint below is the shard's, and the shard has one network identity: `shard0`, the
# alias of most-exchange's cluster-host container, whose media driver binds all of them. The
# subscriptions are dynamic MDC, `endpoint=0.0.0.0:0` announced on the publisher's control address,
# because a Docker bridge does not route multicast (most-exchange deploy/README.md).

# ------------------------------------------------------------------ order entry (Design.md §2)
fix.bindAddress=0.0.0.0
fix.port=9876
fix.sessionsFile=/config/sessions.properties
# On the durable volume: the archive gates every 35=D and reportSeq (CLAUDE.md 7, 11), and Artio's
# logs hold its sequence indexes. fsynced, as production runs (§6.4). Inside Docker Desktop the
# fsync is the VM's, so no figure taken here is the adapter's.
fix.logDir=/data/logs
fix.archiveDir=/data/archive
fix.fileSyncLevel=1
fix.storeDir=/data/store
# The embedded driver's directory, on the container's /dev/shm (shm_size in the compose file).
fix.aeronDir=/dev/shm/fix-aeron

# The directory broadcast: which shard serves which security, and the gateway's endpoints.
fix.directoryChannel=aeron:udp?endpoint=0.0.0.0:0|control=shard0:40000|control-mode=dynamic
fix.directoryStreamId=100

# --------------------------------------------------------------- market data (Design.md §4)
fix.md.port=9877
# Its own engine, archive unsynced and emptied at every start (CLAUDE.md 14).
fix.md.logDir=/data-md/logs
fix.md.archiveDir=/data-md/archive
fix.md.aeronDir=/dev/shm/fix-aeron-md
fix.md.l1.channel=aeron:udp?endpoint=0.0.0.0:0|control=shard0:40001|control-mode=dynamic
fix.md.l1.streamId=1
fix.md.l2.channel=aeron:udp?endpoint=0.0.0.0:0|control=shard0:40002|control-mode=dynamic
fix.md.l2.streamId=2
fix.md.snapshot.channel=aeron:udp?endpoint=0.0.0.0:0|control=shard0:40004|control-mode=dynamic
fix.md.snapshot.streamId=4

# ------------------------------------------------------------- the trading date (Design.md §3.6)
# The dev stack's seed opens the shard with the control container's LocalDate.now(), in UTC, on any
# day of the week, and its scheduler is off. So the adapter's calendar is UTC, every day, rolling
# just before midnight, as the e2e's. A Monday-to-Friday calendar would name Monday on a weekend:
# ahead of the engine, the silent case.
fix.calendar.zone=UTC
fix.calendar.rollTime=23:59
fix.calendar.weekdays=MON,TUE,WED,THU,FRI,SAT,SUN

# Back off rather than busy-spin: the dev stack shares the machine with the whole exchange.
# Production leaves it unset (Design.md §7).
fix.idleStrategy=backoff
